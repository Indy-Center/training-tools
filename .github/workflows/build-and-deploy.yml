name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    env:
      # Here rather than on the step, so the step's `if` can see whether it is set.
      VATUSA_API_KEY: ${{ secrets.ENV_VATUSA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # Migrations run before the deploy so the schema is never behind the code
      # that queries it.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_KEY }}
          command: d1 migrations apply training-db --remote
      # ZID's VATUSA facility key, from the organisation secret, re-set on every
      # deploy so rotating it there is all it takes. Skipped when the secret is
      # not shared with this repository, so its absence never blocks a deploy.
      - name: Set VATUSA_API_KEY
        if: env.VATUSA_API_KEY != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_KEY }}
        run: printf '%s' "$VATUSA_API_KEY" | npx wrangler secret put VATUSA_API_KEY
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_KEY }}

  # Publishes the TrainingRpc types (rpc/) to npm as @indy-center/training-tools
  # when rpc/package.json names a version npm doesn't have yet. Merging without a
  # version bump publishes nothing. After the deploy, so a published contract is
  # never ahead of the Worker that serves it.
  #
  # No token: npm trusts this workflow directly ("trusted publishing"). On
  # npmjs.com the package's settings name this repository and this file,
  # build-and-deploy.yml, with no environment. Renaming the file or moving this
  # job to another workflow breaks publishing until that setting is changed.
  publish-types:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # what npm checks to know the publish came from this workflow
    defaults:
      run:
        working-directory: rpc
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: rpc/package-lock.json
      - name: Is this version on npm already?
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships with npm 10.
      - if: steps.version.outputs.publish == 'true'
        run: npm install -g npm@latest
      - if: steps.version.outputs.publish == 'true'
        run: npm ci
      # `release` builds dist/ and then publishes; it does not rely on a
      # prepublish hook.
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm run release
