name: Tests and Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # build must precede check: src/worker.ts imports the adapter's output at
      # .svelte-kit/cloudflare/_worker.js, which does not exist in a fresh
      # checkout, so type-checking first fails with "Cannot find module".
      - run: npm run build
      - run: npm run check
      - run: npm test
